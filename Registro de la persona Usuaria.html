<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <title>Registro de la persona Usuaria</title>
</head>
<body>
    <div id="titulo">
        <h1>Registro de la persona Usuaria</h1>
    </div>
    <form id="form-registro">
        <h2>Datos</h2>
        <div id="registro">
            <label for="nombre">Nombre</label> <input type="text" id="nombre"><br>
            <label for="apellido">Apellido</label> <input type="text" id="apellido"><br>
            <label for="correoElectronico">Correo Electronico</label> <input type="email" id="correoElectronico"><br>
            <label for="password">Contraseña</label> <input type="password" id="password"><br>
            <label for="description">Descríbete</label> <textarea name="" id="" placeholder="introduce una breve descripción sobre ti"></textarea>
        </div>
        <h2 class="intereses">Intereses</h2>
        <div class="gustos">
            <input type="checkbox" name="tech" id="tech"><label for="tech">Tecnología</label>
            <input type="checkbox" name="arte" id="arte"><label for="arte">Arte</label>
            <input type="checkbox" name="sport" id="sport"><label for="sport">Deporte</label>
            <input type="checkbox" name="read" id="read"><label for="read">Lectura</label>
        </div>
        <br>
        <div id="submit">
            <button id="btnsubmit">Registrarse</button>
        </div>
    </form>
</body>
</html>
